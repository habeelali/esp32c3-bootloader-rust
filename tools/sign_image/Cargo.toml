[package]
name = "sign-image"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sign-image"
path = "src/main.rs"

[dependencies]
anyhow    = "1"
clap      = { version = "4", features = ["derive"] }
p256      = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
sha2      = "0.10"
hex       = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
crc32fast = "1"
